      - name: Run script-style tracer tests
        run: python tools/test_trace.py

  windows-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install shipped dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import shipped server
        env:
          MCP_API_KEY: ci-install-smoke-key
        run: python -c "import main; print('main import OK')"

      - name: Run Windows path tests
        run: python -m pytest -q tools/test_file_ops.py
