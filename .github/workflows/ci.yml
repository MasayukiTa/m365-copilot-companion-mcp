            relay/test_watchdog.py \
            relay/selfimprove/test_apply.py \
            relay/selfimprove/test_archive.py \
            relay/selfimprove/test_calibration.py \
            relay/selfimprove/test_dashboard.py \
            relay/selfimprove/test_diversify.py \
            relay/selfimprove/test_frozen.py \
            relay/selfimprove/test_guards.py \
            relay/selfimprove/test_l2.py \
            relay/selfimprove/test_l2_cron.py \
            relay/selfimprove/test_policy.py \
