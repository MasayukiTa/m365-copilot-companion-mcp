# CI for m365-copilot-companion-mcp - runs the hermetic Python unit tests.
#
# "Hermetic" here means: no Edge/Playwright browser, no M365/Copilot login,
# no :8000/:8011 server, no GPU, no pywin32 (Linux-only exclusion), no network
# calls inside the test logic. The explicit suite below passes on the standard
# ubuntu-latest runner with only pip deps.
#
# EXCLUDED (and why):
#   tools/test_trace.py - contains no test_* functions (only a main()); pytest
#       collects 0 items from it, which is harmless, but it is omitted for clarity.
#   tools/test_file_ops.py - one Windows-path assertion intentionally uses
#       backslash semantics that do not match pathlib on Linux.
#
# NOTE ON LINUX PORTABILITY:
#   relay/relay_fleet.py uses ctypes.windll.kernel32.GlobalMemoryStatusEx, but
#   only inside avail_phys_mb() wrapped in try/except (falls back to 4096 MB).
#   The hermetic tests all monkeypatch that function, so the fallback is never
#   even reached. pywin32 has a sys_platform=="win32" marker in mcp's metadata,
#   so it is not installed on Linux.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # Validate the dependency declaration shipped to users, not a CI-only subset.
      - name: Install shipped dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit hermetic test manifest
        run: python scripts/check_ci_test_manifest.py

      # Run only the hermetic test paths. Explicit file list is the safest guard
      # against accidentally picking up non-hermetic tests when new files are added.
      - name: Run hermetic unit tests
        run: |
          pytest -q \
            tests/test_security_xff.py \
            tests/test_scroll_transcript.py \
            tests/test_golden.py \
            tools/test_python_gate.py \
            tools/test_approval_policy.py \
            tools/test_layer1_security.py \
            tools/test_data_report.py \
            tools/test_data_memory_hook.py \
            tools/test_data_discovery.py \
            tools/test_data_aliases.py \
            tools/test_local_loop_ops.py \
            tools/test_local_loop_registration.py \
            tools/test_notify_ops.py \
            tools/test_procedural_memory.py \
            tools/test_agent_memory_ops.py \
            tools/test_auth_stats.py \
            tools/test_tool_probe.py \
            tools/test_skill_registration.py \
            scripts/test_bootstrap.py \
            scripts/test_bootstrap_p2c.py \
            scripts/test_operational_resilience.py \
            scripts/test_start_companion_edge_headless.py \
            bridge/test_bridge_sessions.py \
            bridge/test_cdp_watchdog.py \
            bridge/test_consent_surface.py \
            bridge/test_p2c_flag.py \
            bridge/test_review_command.py \
