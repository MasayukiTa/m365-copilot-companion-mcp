name: PowerShell lint

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-lint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-lint.yml"

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # PSGallery is not always registered on the runner image -- it stopped being
          # there on 2026-08-06 and Set-PSRepository failed outright, taking the job
          # with it. Register it when missing instead of assuming it is there.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction SilentlyContinue
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
