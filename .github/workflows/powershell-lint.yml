name: PowerShell lint

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-lint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.ps1"
      - ".github/workflows/powershell-lint.yml"

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Hosted runners occasionally lose/break the built-in PSGallery registration.
          # `Register-PSRepository -Default` itself failed on 2026-09-29 with NuGet
          # `Missing option value for: -source`, so repair from explicit canonical endpoints
          # instead of asking PowerShellGet to rediscover its defaults.
          $gallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if (-not $gallery -or [string]::IsNullOrWhiteSpace([string]$gallery.SourceLocation)) {
            if ($gallery) { Unregister-PSRepository -Name PSGallery -ErrorAction SilentlyContinue }
            Register-PSRepository -Name PSGallery `
              -SourceLocation 'https://www.powershellgallery.com/api/v2' `
              -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2/items/psscript' `
              -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery -ErrorAction Stop

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
