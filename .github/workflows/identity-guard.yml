name: Identity guard
on:
  pull_request:
  push:

jobs:
  identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit identities
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/check_commit_identities.py "$BEFORE" "$AFTER" "$DEFAULT_BRANCH"

