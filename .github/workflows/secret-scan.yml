name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 19 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # FULL HISTORY, because the scan below it only ever looked at the current tree. A
          # secret that was committed and then deleted is gone from the working tree and still
          # in every clone -- which is the case the scan exists for, and the only one it was
          # not covering.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Prepare tracked tree
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-source"
          git ls-files -z | tar --null -T - -cf - | tar -C "$RUNNER_TEMP/gitleaks-source" -xf -

      - name: Run Gitleaks on current tree
        run: |
          "$HOME/go/bin/gitleaks" detect --source "$RUNNER_TEMP/gitleaks-source" --no-git --redact --verbose

      - name: Run Gitleaks on the full history
        run: |
          # A separate step from the tree scan above, and not a replacement for it: the tree
          # scan sees files that are present but never committed, and this sees values that
          # were committed and later removed. Neither finds the other's case.
          "$HOME/go/bin/gitleaks" detect --redact --verbose --log-opts="--all"
