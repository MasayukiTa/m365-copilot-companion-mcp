name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 19 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1

      - name: Prepare tracked tree
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-source"
          git ls-files -z | tar --null -T - -cf - | tar -C "$RUNNER_TEMP/gitleaks-source" -xf -

      - name: Run Gitleaks on current tree
        run: |
          "$HOME/go/bin/gitleaks" detect --source "$RUNNER_TEMP/gitleaks-source" --no-git --redact --verbose
