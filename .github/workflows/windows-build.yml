name: Windows build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  csharp:
    name: C# compile
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C# UI and helper binaries
        shell: pwsh
        run: ./.github/scripts/build-csharp-codeql.ps1

  release-package:
    name: Release ZIP smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and inspect release ZIP
        shell: pwsh
        run: ./.github/scripts/test-release-package.ps1 -Version "ci-${{ github.sha }}"
